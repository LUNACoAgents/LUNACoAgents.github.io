<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>第0話 投資部へようこそ。｜LUNA学園 投資部</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --paper:#fff6f8; --sheet:#ffffff; --ink:#27304f; --pink:#e8618c; --muted:#5a6282; --navy:#24305e; --gold:#b8892b; --crimson:#b3263c; --line:#d6dbea;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1a1626; --sheet:#241f36; --pink:#ff8fb2; --ink:#eef0fa; --muted:#a9b0cf; --navy:#c9d2ff; --gold:#e2b860; --crimson:#ff7d8f; --line:#2d3560; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1a1626; --sheet:#241f36; --pink:#ff8fb2; --ink:#eef0fa; --muted:#a9b0cf; --navy:#c9d2ff; --gold:#e2b860; --crimson:#ff7d8f; --line:#2d3560; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.8}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;font-size:14px}
.bar a{text-decoration:none;color:var(--muted)}
.bar .brand{font-family:var(--display);font-weight:700;color:var(--ink);font-size:17px}
.head{padding-block:8px 20px}
.no{color:var(--gold);font-weight:700;font-size:13px;letter-spacing:.12em}
h1{font-family:var(--display);font-weight:900;color:var(--navy);font-size:clamp(26px,6vw,36px);margin:2px 0 6px;line-height:1.35;text-wrap:balance}
.head p{margin:0;color:var(--muted);font-size:14px}
.pages{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.pages li{position:relative}
.pages img{width:100%;border-radius:6px;box-shadow:0 10px 30px -18px rgba(20,25,60,.5)}
.pg{position:absolute;right:10px;bottom:10px;background:rgba(20,25,60,.7);color:#fff;font-size:12px;padding:2px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.end{margin-top:28px;background:var(--sheet);border:1.5px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.end h2{margin:0;font-size:17px}
.end p{margin:0;color:var(--muted);font-size:14px}
.term{font-size:14px;color:var(--muted)}
.term b{color:var(--navy)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{display:flex;align-items:center;justify-content:center;padding:13px 16px;border-radius:999px;font-weight:700;text-decoration:none;font-size:15px;text-align:center}
.btn.primary{background:var(--pink);color:#fff}
.btn.ghost{border:1.5px solid var(--navy);color:var(--navy)}
</style>
</head>
<body>
<div class="wrap">
  <nav class="bar" aria-label="サイト内メニュー">
    <a class="brand" href="index.html">LUNA学園 投資部</a>
    <a href="index.html#manga">話の一覧</a>
  </nav>

  <header class="head">
    <div class="no">第1章　第000話</div>
    <h1>投資部へようこそ。</h1>
    <p>100万円から始まる、投資と成長の物語。</p>
  </header>

  <ol class="pages">
    <li><img src="manga/ep000_01.jpg" alt="第0話 1ページ目。桜の窓辺で、入部届を持ったルナが投資部の扉の前に立つ。「投資って……ちょっと面白そうかも。」" width="1200" height="1200"><span class="pg">1 / 4</span></li>
    <li><img src="manga/ep000_02.jpg" alt="第0話 2ページ目。扉を開けると顧問のセリナ先生が「待ってたわ、月城さん。」" width="1200" height="1200" loading="lazy"><span class="pg">2 / 4</span></li>
    <li><img src="manga/ep000_03.jpg" alt="第0話 3ページ目。先生がルナの手に投資部のしるしを渡す。" width="1200" height="1200" loading="lazy"><span class="pg">3 / 4</span></li>
    <li><img src="manga/ep000_04.jpg" alt="第0話 4ページ目。「まずは100万円から、始めましょう。」「ひゃ、100万円〜っ!?」" width="1200" height="1200" loading="lazy"><span class="pg">4 / 4</span></li>
  </ol>

  <section class="end" aria-labelledby="h-end">
    <h2 id="h-end">こうして、ルナの投資生活が始まった。</h2>
    <p class="term">この話に出てきた言葉：<b>LUNA FUND</b>（投資部で運用する100万円のこと）</p>
  </section>

  <div class="nav">
    <a class="btn ghost" href="index.html#manga">話の一覧へ</a>
    <a class="btn primary" href="index.html#manga">次の話へ（準備中）</a>
  </div>
</div>
</body>
</html>
