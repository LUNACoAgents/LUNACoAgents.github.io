    <h1>売上は増えたのに？</h1>
    <p>「売上は100億円に増えたのに、利益は減ってる！？」――売上と利益は、別々に動くこともある。</p>
  </header>

  <ol class="pages">
    <li><img src="manga/ep004_01.jpg?v=88247fc322" alt="第4話 1ページ目。星野雑貨の決算資料で、売上高が前年80億円から今年100億円になったのを見て「去年の売上は80億円、今年は100億円！」と喜ぶルナ。セリナ先生は「ちゃんと伸びてるね！」" width="1254" height="1254"><span class="pg">1 / 4</span></li>
    <li><img src="manga/ep004_02.jpg?v=f3c3ec5c48" alt="第4話 2ページ目。利益は前年6億円から今年5億円に減っているのに気づき「えええっ!? 利益、減ってる〜〜っ!!」と驚くルナ。" width="1254" height="1254" loading="lazy"><span class="pg">2 / 4</span></li>
    <li><img src="manga/ep004_03.jpg?v=36b51187b0" alt="第4話 3ページ目。白石栞が登場。「月城さん、声、廊下まで聞こえてたよ。」ルナは「白石さん!? 投資部だったの!?」としおりが投資部・財務分析担当だと知る。" width="1254" height="1254" loading="lazy"><span class="pg">3 / 4</span></li>

  </ol>

  <section class="end" aria-labelledby="h-end">
    <h2 id="h-end">売上は増えても、利益は減ることがある。</h2>
    <p class="term">この話に出てきた言葉：<b>売上と利益の動き</b>（売上は前年80億円から100億円に増えたのに、利益は6億円から5億円に減った。利益は「売上 − 費用」なので、費用が増えると利益は減る。数字は前年と比べて確認する）</p>
